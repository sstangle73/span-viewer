[project]
name = "span-viewer"
version = "0.1.0"
description = "Historical analytics and a live view for a SPAN smart panel: FastAPI, HTMX, ECharts, TimescaleDB."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Steven Storie" }]
# Kept in step with app/requirements.txt and ingester/requirements.txt, which
# the deploy timer and the Dockerfile install from.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "psycopg[binary,pool]>=3.2",
    "requests>=2.32",
    "paho-mqtt>=2.1",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pycognito>=2024.5.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "ingester"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notes", "data"]

[tool.ruff.lint]
# Real bugs only (syntax errors, undefined names, unused imports, shadowed
# definitions); style is left to review.
select = ["E9", "F"]
ignore = ["F541"]

