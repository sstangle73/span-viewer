<?xml version="1.0" encoding="UTF-8"?>
<!-- span-viewer app icon. CB-safe: blue + amber accents, no red/green pairing.
     Designed as a maskable icon — main content sits inside the 80% safe area
     (centered, 410px circle) so Android's adaptive-icon masks don't crop it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background tile -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>

  <!-- Subtle inner gradient for depth -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="56" y="56" width="400" height="400" rx="64" fill="url(#bg)"/>

  <!-- Smart-panel breaker grid: 4x4 dots, the column under the bolt is "live" amber -->
  <g fill="#334155">
    <circle cx="160" cy="160" r="14"/>
    <circle cx="160" cy="216" r="14"/>
    <circle cx="160" cy="272" r="14"/>
    <circle cx="160" cy="328" r="14"/>

    <circle cx="216" cy="160" r="14"/>
    <circle cx="216" cy="216" r="14"/>
    <circle cx="216" cy="272" r="14"/>
    <circle cx="216" cy="328" r="14"/>

    <circle cx="296" cy="160" r="14"/>
    <circle cx="296" cy="216" r="14"/>
    <circle cx="296" cy="272" r="14"/>
    <circle cx="296" cy="328" r="14"/>

    <circle cx="352" cy="160" r="14"/>
    <circle cx="352" cy="216" r="14"/>
    <circle cx="352" cy="272" r="14"/>
    <circle cx="352" cy="328" r="14"/>
  </g>

  <!-- Lightning bolt — energy / live circuit cue -->
  <path d="M276 128 L196 280 L248 280 L236 384 L324 224 L268 224 Z"
        fill="url(#bolt)" stroke="#0f172a" stroke-width="6" stroke-linejoin="round"/>
</svg>
